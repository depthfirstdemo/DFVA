name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    env:
      DEPTHFIRST_FIREWALL_TOKEN: ${{ secrets.Dependency_Firewall_Token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # .npmrc in the repo root routes this through firewall.depthfirst.com,
      # which checks every package against org policy before it reaches CI.
      - name: Install dependencies (via DepthFirst Firewall)
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --ci --coverage

  build:
    name: Build
    needs: lint-and-test
    runs-on: ubuntu-latest

    env:
      DEPTHFIRST_FIREWALL_TOKEN: ${{ secrets.Dependency_Firewall_Token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies (via DepthFirst Firewall)
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
